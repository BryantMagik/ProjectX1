<main class="flex-1">
    <div class="max-w-7xl mx-auto py-6 sm:px-5 lg:px-8">
      <!-- Subtasks Section -->
      <div class="bg-white shadow sm:rounded-lg">
        <div class="px-4 py-5 sm:p-6">
          <h2 class="text-2xl leading-6 font-medium text-gray-900">Subtareas</h2>
          <div class="mt-5 overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th scope="col" class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                  <th scope="col" class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                  <th scope="col" class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descripción</th>
                  <th scope="col" class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                  <th scope="col" class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Task ID</th>
                  <th scope="col" class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha de Creación</th>
                  <th scope="col" class="px-5 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha de Actualización</th>
                  <th scope="col" class="relative px-5 py-3">
                    <span class="sr-only">Ver</span>
                  </th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                <!-- Subtask Item -->
                <tr>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-500">1</td>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-900">Subtarea A</td>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-500">Descripción de la subtarea A</td>
                  <td class="px-5 py-4 whitespace-nowrap">
                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">Pendiente</span>
                  </td>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-500">TAREA-001</td>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-500">2024-07-20</td>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-500">2024-07-21</td>
                  <td class="px-5 py-4 whitespace-nowrap text-right text-sm font-medium">
                    <a class="text-indigo-600 hover:text-indigo-900" (click)="setMirando(3); setMostrar(4)">Ver</a>
                  </td>
                </tr>
                <!-- More subtasks... -->
                <tr>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-500">2</td>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-900">Subtarea B</td>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-500">Descripción de la subtarea B</td>
                  <td class="px-5 py-4 whitespace-nowrap">
                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">En Progreso</span>
                  </td>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-500">TAREA-002</td>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-500">2024-07-19</td>
                  <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-500">2024-07-22</td>
                  <td class="px-5 py-4 whitespace-nowrap text-right text-sm font-medium">
                    <a class="text-indigo-600 hover:text-indigo-900" (click)="setMirando(3); setMostrar(4)">Ver</a>
                  </td>
                </tr>
                <!-- More subtasks... -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
